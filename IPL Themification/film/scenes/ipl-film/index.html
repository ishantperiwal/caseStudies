  @font-face { font-family: 'InterLocal'; font-weight: 400; src: url(/vendor/@fontsource/inter/files/inter-latin-400-normal.woff2) format('woff2'); }

  /* ground from the IPL case-study cover: warm tan, lighter grid lines */
  #stage { --stage-bg: #E1BB98; }
  /* the grid lies on the wall's plane, so it takes the same angle */
  #grid { position: absolute; left: -4500px; top: -4500px; width: 9000px; height: 9000px; background-color: #E1BB98;
    background-image: linear-gradient(90deg, #E8CBB1 0 var(--line), transparent var(--line)), linear-gradient(0deg, #E8CBB1 0 var(--line), transparent var(--line));
    background-size: var(--cell) var(--cell); background-position: var(--ox) var(--oy); }
  /* two layers seen through the same camera: the ground, and the phones (their own layer, so the sticker outline
     traces only the phones' silhouettes, thickness included) */
  #ground, #cam, #camFocus, #shadows { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }   /* the camera's view, as a 2D transform (scene.js) */
  #outline { position: absolute; inset: 0; filter: url(#stickerF); }
  #outline2 { position: absolute; inset: 0; }   /* phones here carry their own outline (+ blur): scene.js */
  #rest, #shadowsWrap { position: absolute; inset: 0; }
  /* the shadow a lifted phone leaves on the wall */
  .lift-sh { position: absolute; left: 0; top: 0; width: 300px; height: 620px; border-radius: 40px; background: rgba(40, 24, 10, .45); filter: blur(22px); display: none; }
  /* a phone: an extruded dark body (no buttons), the real screen on its face */
  .ph { position: absolute; left: 0; top: 0; width: 300px; height: 620px; }
  .ph .thick { position: absolute; inset: 0; border-radius: 40px; background: #2B353E; }   /* the body: its box-shadows are the slabs */
  .ph .face { position: absolute; inset: 0; border-radius: 40px; background: #090D10; box-shadow: inset 0 0 0 1.6px #4A5560, inset 0 0 0 2.7px #232C33, inset 0 0 0 3.9px #090D10; }   /* the Thumbnail explainer's bezel: near-black with a fine metal rim */
  .ph .scr { position: absolute; left: 9px; top: 9px; right: 9px; bottom: 9px; border-radius: 32px; overflow: hidden; background: #fff;
    clip-path: inset(1.5px round 30.5px); }   /* everything on the screen is trimmed to one edge, 1.5px in, so it blends into the bezel (no white hairline, no steps) */
  /* status bar (30 px, clear of the island) above the screen's content */
  .ph .sbar { position: absolute; left: 0; top: 0; width: 100%; height: 31px; z-index: 2; }   /* 1 px over the content below, so no seam shows between them */
  .ph .sbar b { position: absolute; left: 30px; top: 11px; font: 600 12px/14px -apple-system, 'SF Pro Text', system-ui; color: #000; letter-spacing: -.1px; }
  .ph .sbar img { position: absolute; right: 22px; top: 13px; width: 52px; height: 9px; }
  .ph .sbar.light b { color: #fff; } .ph .sbar.light img { filter: invert(1); }
  .ph .body { position: absolute; left: 0; top: 30px; right: 0; bottom: 0; overflow: hidden; background: #fff; }
  .ph .body > * { position: absolute; left: 0; top: 0; width: 100%; }
  .ph .scr img { display: block; }

  .hm { width: 360px !important; height: 730px; transform: scale(calc(282 / 360)); transform-origin: 0 0; overflow: hidden; background: #fff;
    font-family: 'InterLocal', system-ui; -webkit-font-smoothing: antialiased; }
  .hm * { position: absolute; margin: 0; box-sizing: border-box; }

  .hm .tile.w { border-color: #6797ff; background: #fff; }

  .hm .cat .lbl { top: 60px; }

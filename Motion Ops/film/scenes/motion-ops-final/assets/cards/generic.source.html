<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Cool; src: url(coolvetica.otf); }
@font-face { font-family: InterL; font-weight: 400; src: url(inter-latin-400-normal.woff2); }
@font-face { font-family: InterL; font-weight: 700; font-style: italic; src: url(inter-latin-700-italic.woff2); }
html, body { margin: 0; background: transparent; }
.card { position: relative; width: 456px; height: 675px; background: #0d2d55; overflow: hidden; }
.upper { position: absolute; left: 0; top: 22px; width: 456px; }
.pill { position: absolute; left: 152px; top: 0; width: 152px; height: 70px; }
.pill img { position: absolute; left: calc(50% + 0.38px - 119.379px - 120px); top: -19.75px; width: 478.758px; height: 318.733px; transform: translateY(-120px); }
.name { position: absolute; left: 76.5px; top: -2.75px; transform: translateX(-50%); white-space: nowrap; font: 32px/normal Cool; color: transparent;
  background: linear-gradient(90deg, #3bd1e5, #bfcc7e); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 3px 0 rgba(0,0,0,.55)); }
.frame { position: absolute; left: 0; top: 57px; width: 456px; height: 570px; border-radius: 32px; background: linear-gradient(180deg, rgba(10,40,77,.75) 0%, rgba(10,40,77,0) 9.825%); }
.hdr { position: absolute; left: 24px; top: 20px; width: 408px; height: 51px; font-family: InterL; font-weight: 700; font-style: italic; white-space: nowrap; }
.hdr .l { position: absolute; left: 28px; top: 9.75px; font-size: 26px; color: #fff; }
.hdr .r { position: absolute; right: 20px; top: 12.25px; font-size: 22px; color: #416fab; }
.abs { position: absolute; }
.rows { position: absolute; left: 85px; top: 472px; display: flex; flex-direction: column; gap: 16px; font: 400 31.051px/normal InterL; color: #fff; white-space: nowrap; }
.row { display: flex; align-items: center; gap: 20px; height: 38px; }
</style></head><body>
<div class="card" id="card">
  <div class="upper">
    <div class="pill"><img src="e49d3.svg"><div class="name">Motion Card</div></div>
    <div class="frame">
      <div class="hdr"><span class="l">Motion</span><span class="r">Component</span></div>
      <img class="abs" src="74d66.svg" style="left:24.5px; top:89px; width:407px; height:354px">
      <img class="abs" src="16a19.png" style="left:62.5px; top:108.5px; width:330px; height:330px; object-fit:cover">
      <svg class="abs" style="left:85px; top:127px; overflow:visible" width="285.548" height="284.896" viewBox="0 0 285.548 284.896" fill="none">
        <!-- the curve: 0.6, 0, 0.2, 1 (the film's opening curve, so it lands on the print exactly), in the card's own style -->
        <path d="M11.501 273.429H185.75" stroke="#4B8EE3" stroke-width="2.83" stroke-linecap="round"/>
        <path d="M274.047 11.532H69.75" stroke="#4B8EE3" stroke-width="3.27" stroke-linecap="round"/>
        <path d="M11.501 273.429C185.75 273.429 69.75 11.532 274.047 11.532" stroke="#EBF2FC" stroke-width="3.27" stroke-linecap="round"/>
        <circle cx="185.75" cy="273.429" r="7.08" fill="#0E315C" stroke="#fff" stroke-width="3.27"/>
        <circle cx="69.75" cy="11.532" r="7.08" fill="#0E315C" stroke="#fff" stroke-width="3.27"/>
        <circle cx="11.5" cy="273.4" r="11.5" fill="#1F6ACA"/><circle cx="274.047" cy="11.5" r="11.5" fill="#1F6ACA"/>
      </svg>
      <div class="rows">
        <div class="row"><img src="ed140.svg" width="26" height="28"><span>Easing token</span></div>
        <div class="row" style="gap:19.5px"><img src="11bcf.svg" width="24.877" height="26.883" style="margin-top:2px"><span>Duration token</span></div>
      </div>
    </div>
  </div>
</div></body></html>
